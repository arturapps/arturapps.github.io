name: ChatGPT ETAL search

on:
  push:
    branches:
      - chatgpt-legal-export-20260729
    paths:
      - automation/search_etal.py
      - .github/workflows/chatgpt-etal-search.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-legal-export-20260729
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - run: python automation/search_etal.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal_export/search_results.json
          git commit -m "Search ETAL document identifiers" || exit 0
          git push origin HEAD:chatgpt-legal-export-20260729
