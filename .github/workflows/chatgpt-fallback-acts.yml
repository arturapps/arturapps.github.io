name: ChatGPT fallback acts
on:
  push:
    branches: [chatgpt-legal-export-20260729]
    paths:
      - automation/fetch_public_fallbacks.py
      - .github/workflows/chatgpt-fallback-acts.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-legal-export-20260729
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - run: python automation/fetch_public_fallbacks.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fallback_export
          git commit -m "Export public fallback legal texts" || exit 0
          git push origin HEAD:chatgpt-legal-export-20260729
      - uses: actions/upload-artifact@v4
        with:
          name: fallback-acts-20260729
          path: fallback_export/fallback_acts.zip
          retention-days: 7
