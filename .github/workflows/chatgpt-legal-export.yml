name: ChatGPT legal export

on:
  push:
    branches:
      - chatgpt-legal-export-20260729
    paths:
      - automation/export_legislation.py
      - .github/workflows/chatgpt-legal-export.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-legal-export-20260729
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - run: python automation/export_legislation.py
      - name: Commit export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal_export
          git commit -m "Export official legislation texts 2026-07-29" || exit 0
          git push origin HEAD:chatgpt-legal-export-20260729
      - uses: actions/upload-artifact@v4
        with:
          name: legislation-export-20260729
          path: legal_export/legislation_export.zip
          retention-days: 7
